<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclusive Web Validator</title>
    <!-- Tailwind CSS via CDN (No build step required) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        /* Custom scrollbar for cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-6 md:p-12">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="flex items-center gap-3 border-b border-slate-200 pb-6">
            <div class="p-3 bg-indigo-600 rounded-lg text-white">
                <!-- Shield Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Inclusive Web Validator</h1>
                <p class="text-slate-500">Automated accessibility compliance scanner</p>
            </div>
        </header>

        <!-- Scanner Input -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <form id="scanForm" class="flex gap-4 items-end">
                <div class="flex-1">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Target URL</label>
                    <input type="url" id="urlInput" required placeholder="https://example.com"
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
                <button type="submit" id="scanBtn"
                    class="px-6 py-3 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition flex items-center gap-2 disabled:bg-indigo-400 disabled:cursor-not-allowed">
                    <span id="btnText">Start Scan</span>
                </button>
            </form>
            <p id="errorMsg" class="mt-3 text-red-600 text-sm hidden"></p>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Sidebar: History -->
            <div class="lg:col-span-1 space-y-4">
                <h2 class="text-xl font-semibold text-slate-800">Scan History</h2>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden max-h-[600px] overflow-y-auto" id="historyList">
                    <div class="p-8 text-center text-slate-400">Loading history...</div>
                </div>
            </div>

            <!-- Main: Report Details -->
            <div class="lg:col-span-2" id="reportContainer">
                <!-- Placeholder State -->
                <div class="h-full min-h-[400px] flex flex-col items-center justify-center bg-white rounded-xl border border-dashed border-slate-300 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-4 opacity-20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                    <p>Select a completed scan to view details</p>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = 'http://localhost:8000';
        let isScanning = false;
        let currentScanId = null;
        let pollInterval = null;

        // Icons (SVG strings)
        const ICONS = {
            check: `<svg class="text-green-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
            alert: `<svg class="text-orange-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
            error: `<svg class="text-red-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
            clock: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
            chevron: `<svg class="text-slate-400 transition-transform duration-200" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>`,
            link: `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchReports();
        });

        // --- Event Listeners ---
        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isScanning) return;

            const url = document.getElementById('urlInput').value;
            startScan(url);
        });

        // --- API Functions ---

        async function fetchReports() {
            try {
                const res = await fetch(`${API_URL}/reports`);
                if(!res.ok) throw new Error("Backend unreachable");
                const data = await res.json();
                renderHistory(data);
            } catch (err) {
                document.getElementById('historyList').innerHTML = `<div class="p-8 text-center text-red-400 text-sm">Failed to load history.<br>Is backend running?</div>`;
            }
        }

        async function startScan(url) {
            setLoading(true);
            document.getElementById('errorMsg').classList.add('hidden');

            try {
                const res = await fetch(`${API_URL}/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, max_pages: 5, max_depth: 1 })
                });
                
                if (!res.ok) throw new Error("Failed to start scan");
                const data = await res.json();
                
                currentScanId = data.scan_id;
                pollStatus();
            } catch (err) {
                showError(err.message);
                setLoading(false);
            }
        }

        function pollStatus() {
            // Poll every 2 seconds
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_URL}/scan/${currentScanId}/status`);
                    const data = await res.json();
                    
                    if (data.status === 'COMPLETED' || data.status === 'FAILED') {
                        clearInterval(pollInterval);
                        setLoading(false);
                        fetchReports(); // Refresh list
                        if (data.status === 'COMPLETED') {
                            loadReportDetails(currentScanId);
                        } else {
                            showError("Scan failed. Check backend logs.");
                        }
                    }
                } catch (err) {
                    console.error("Polling error", err);
                }
            }, 2000);
        }

        async function loadReportDetails(scanId) {
            const container = document.getElementById('reportContainer');
            container.innerHTML = `<div class="h-full flex items-center justify-center text-slate-500">Loading report...</div>`;
            
            // Highlight active history item
            document.querySelectorAll('.history-item').forEach(el => {
                el.classList.remove('bg-indigo-50', 'border-indigo-500');
                el.classList.add('border-transparent');
                if(el.dataset.id == scanId) {
                    el.classList.add('bg-indigo-50', 'border-indigo-500');
                    el.classList.remove('border-transparent');
                }
            });

            try {
                const res = await fetch(`${API_URL}/report/${scanId}`);
                if (!res.ok) throw new Error("Report not ready");
                const report = await res.json();
                renderReport(report);
            } catch (err) {
                container.innerHTML = `<div class="p-6 text-red-500">Error loading report: ${err.message}</div>`;
            }
        }

        // --- Rendering Functions ---

        function renderHistory(reports) {
            const container = document.getElementById('historyList');
            if (reports.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">No scans yet</div>`;
                return;
            }

            container.innerHTML = `<div class="divide-y divide-slate-100">
                ${reports.map(scan => `
                    <div onclick="${scan.status === 'COMPLETED' ? `loadReportDetails(${scan.scan_id})` : ''}" 
                         data-id="${scan.scan_id}"
                         class="history-item p-4 cursor-pointer transition hover:bg-slate-50 border-l-4 border-transparent">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-medium text-slate-900 truncate w-3/4 text-sm" title="${scan.url}">${scan.url}</span>
                            ${getStatusBadge(scan.status)}
                        </div>
                        <div class="flex items-center gap-2 text-xs text-slate-500">
                            ${ICONS.clock}
                            <!-- IST Formatting Applied Here -->
                            ${formatToIST(scan.created_at)}
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderReport(report) {
            const summary = report.summary || { total_violations: 0, by_impact: {} };
            const container = document.getElementById('reportContainer');

            container.innerHTML = `
                <div class="space-y-6 fade-in">
                    <!-- Summary Cards -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        ${renderSummaryCard("Total", summary.total_violations, "indigo")}
                        ${renderSummaryCard("Critical", summary.by_impact.critical || 0, "red")}
                        ${renderSummaryCard("Serious", summary.by_impact.serious || 0, "orange")}
                        ${renderSummaryCard("Moderate", summary.by_impact.moderate || 0, "yellow")}
                    </div>

                    <!-- Pages List -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 border-b border-slate-100 bg-slate-50">
                            <h3 class="font-semibold text-slate-800">Scanned Pages (${report.pages.length})</h3>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${report.pages.map((page, idx) => renderPageItem(page, idx)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPageItem(page, idx) {
            const violations = page.axe?.violations || [];
            const hasError = !!page.error;
            const icon = hasError ? ICONS.error : (violations.length > 0 ? ICONS.alert : ICONS.check);
            
            return `
                <div class="group">
                    <button onclick="togglePageDetails('page-${idx}')" 
                        class="w-full flex items-center justify-between p-4 text-left hover:bg-slate-50 transition">
                        <div class="flex items-center gap-3 overflow-hidden">
                            ${icon}
                            <span class="truncate text-sm font-medium text-slate-700" title="${page.url}">${page.url}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            ${!hasError ? `<span class="text-xs px-2 py-1 rounded-full font-medium ${violations.length > 0 ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}">${violations.length} Issues</span>` : ''}
                            <div id="chevron-page-${idx}">${ICONS.chevron}</div>
                        </div>
                    </button>

                    <div id="page-${idx}" class="hidden p-4 bg-slate-50 border-t border-slate-100 text-sm space-y-4">
                        ${hasError ? 
                            `<div class="text-red-600 bg-red-50 p-3 rounded border border-red-100"><strong>Error:</strong> ${page.error}</div>` 
                            : 
                            (violations.length === 0 ? `<div class="text-green-600 pl-2">No accessibility violations found.</div>` : violations.map(v => renderViolation(v)).join(''))
                        }
                        ${page.screenshot ? `
                            <div class="mt-4">
                                <p class="text-xs font-bold text-slate-500 uppercase mb-2">Screenshot Path</p>
                                <code class="text-xs bg-slate-200 px-2 py-1 rounded text-slate-700">${page.screenshot}</code>
                            </div>` : ''
                        }
                    </div>
                </div>
            `;
        }

        function renderViolation(v) {
            const colors = {
                critical: 'bg-red-100 text-red-800',
                serious: 'bg-orange-100 text-orange-800',
                moderate: 'bg-yellow-100 text-yellow-800',
                minor: 'bg-blue-100 text-blue-800',
            };
            const badgeClass = colors[v.impact] || 'bg-gray-100 text-gray-800';

            return `
                <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded ${badgeClass}">${v.impact}</span>
                            <span class="font-bold text-slate-800">${v.id}</span>
                        </div>
                        <a href="${v.helpUrl}" target="_blank" class="text-indigo-600 hover:underline flex items-center gap-1 text-xs">
                            Learn more ${ICONS.link}
                        </a>
                    </div>
                    <p class="text-slate-600 mb-3">${v.description}</p>
                    <div class="bg-slate-100 rounded p-2 text-xs font-mono text-slate-700 overflow-x-auto">
                        ${v.nodes.length} occurrences. Example target: ${v.nodes[0]?.target.join(', ')}
                    </div>
                </div>
            `;
        }

        function renderSummaryCard(label, value, color) {
            const themes = {
                indigo: 'bg-indigo-50 text-indigo-700 border-indigo-100',
                red: 'bg-red-50 text-red-700 border-red-100',
                orange: 'bg-orange-50 text-orange-700 border-orange-100',
                yellow: 'bg-yellow-50 text-yellow-700 border-yellow-100',
            };
            return `
                <div class="p-4 rounded-xl border ${themes[color]}">
                    <div class="text-3xl font-bold mb-1">${value}</div>
                    <div class="text-xs uppercase font-semibold opacity-80">${label}</div>
                </div>
            `;
        }

        function getStatusBadge(status) {
            const styles = {
                COMPLETED: 'bg-green-100 text-green-700',
                FAILED: 'bg-red-100 text-red-700',
                RUNNING: 'bg-blue-100 text-blue-700',
                QUEUED: 'bg-slate-100 text-slate-700',
            };
            return `<span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider ${styles[status] || styles.QUEUED}">${status}</span>`;
        }

        // --- Helpers ---
        
        function formatToIST(dateString) {
            if (!dateString) return 'N/A';
            
            // Append 'Z' to force UTC interpretation if missing
            // Most backends send ISO string without Z (e.g. "2023-10-25T10:00:00")
            // We treat it as UTC to properly convert to IST.
            const safeDateString = dateString.endsWith('Z') ? dateString : dateString + 'Z';
            
            const date = new Date(safeDateString);
            
            // Force English-India locale with Kolkata timezone
            return date.toLocaleString("en-IN", {
                timeZone: "Asia/Kolkata",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            }).toUpperCase(); // Makes am/pm -> AM/PM
        }

        window.togglePageDetails = (id) => {
            const el = document.getElementById(id);
            const chevron = document.getElementById(`chevron-${id}`);
            el.classList.toggle('hidden');
            if (!el.classList.contains('hidden')) {
                chevron.style.transform = 'rotate(90deg)';
            } else {
                chevron.style.transform = 'rotate(0deg)';
            }
        };

        function setLoading(loading) {
            isScanning = loading;
            const btn = document.getElementById('scanBtn');
            const btnText = document.getElementById('btnText');
            const input = document.getElementById('urlInput');
            
            input.disabled = loading;
            if (loading) {
                btn.disabled = true;
                btn.classList.add('bg-indigo-400', 'cursor-not-allowed');
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-md');
                btnText.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Scanning...`;
            } else {
                btn.disabled = false;
                btn.classList.remove('bg-indigo-400', 'cursor-not-allowed');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-md');
                btnText.innerText = 'Start Scan';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        // Expose functions to window for onclick handlers
        window.loadReportDetails = loadReportDetails;
    </script>
</body>
</html>
